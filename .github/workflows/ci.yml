name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet build AgentWpf.slnx -c Release
      # E2E tests need an interactive desktop and run locally only.
      - run: dotnet test AgentWpf.slnx -c Release --no-build --filter "TestCategory!=E2E"
