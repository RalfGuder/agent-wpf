name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet test AgentWpf.slnx -c Release --filter "TestCategory!=E2E"
      - run: dotnet publish src/AgentWpf -c Release -r win-x64 --self-contained -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -p:DebugType=none -p:GenerateDocumentationFile=false -o publish
      - run: Compress-Archive -Path publish/agent-wpf.exe, LICENSE, README.md, skills -DestinationPath agent-wpf-${{ github.ref_name }}-win-x64.zip
        shell: pwsh
      - uses: softprops/action-gh-release@v2
        with:
          files: agent-wpf-${{ github.ref_name }}-win-x64.zip
